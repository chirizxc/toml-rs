name: CI

permissions: { }

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    name: "linux (${{ matrix.platform.runner }} / ${{ matrix.platform.target }})"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          #- {
          #  runner: ubuntu-latest,
          #  target: aarch64,
          #  interpreter: "3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11",
          #  maturin-args: "--release --out dist --zig"
          #}
          #- {
          #  runner: ubuntu-latest,
          #  target: armv7,
          #  interpreter: "3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11",
          #  maturin-args: "--release --out dist  --zig"
          #}
          #- {
          #  runner: ubuntu-latest,
          #  target: s390x,
          #  interpreter: "3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11",
          #  maturin-args: "--release --out dist  --zig"
          #}
          - {
            runner: ubuntu-latest,
            target: ppc64le,
            interpreter: "3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11",
            maturin-args: "--release --out dist --zig"
          }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.x
      - name: "Build wheels"
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.maturin-args }} --interpreter ${{ matrix.platform.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
          manylinux: auto
      - name: "Upload wheels"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  linuxtest:
    name: "linuxtest (${{ matrix.platform.target }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          #- { target: aarch64-unknown-linux-gnu, interpreter: "3.10 3.11 3.12" }
          #- { target: armv7-unknown-linux-gnueabihf, interpreter: "3.10 3.11 3.12" }
          #- { target: s390x-unknown-linux-gnu, interpreter: "3.10 3.11 3.12" }
          - {
            target: powerpc64le-unknown-linux-gnu,
            interpreter: "3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11"
          }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup target add powerpc64le-unknown-linux-gnu
          uv pip install \
            maturin \
            'ziglang==0.15.1' \
            cffi \
            patchelf \
            --system
          export CARGO_ZIGBUILD_TARGET=powerpc64le-unknown-linux-gnu          
          maturin build --release --out dist --zig \
            --target ${{ matrix.platform.target }} \
            --interpreter ${{ matrix.platform.interpreter }}

